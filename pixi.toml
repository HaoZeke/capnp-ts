[workspace]
name = "capnp-ts"
version = "0.1.0-dev"
description = "Pure TypeScript Cap'n Proto (HaoZeke family)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
capnproto = "1.4.*"
nodejs = ">=20"
# interop/ links the capnp-C++ RPC peer the vat is tested against.
cxx-compiler = "*"
pkg-config = "*"

[feature.docs]
dependencies = { python = ">=3.10", sphinx = ">=7,<9", emacs = "*" }
[feature.docs.pypi-dependencies]
shibuya = ">=2025.12.13, <2027"
sphinx-copybutton = ">=0.5.2, <1"
sphinx-design = ">=0.6, <1"
myst-parser = ">=4.0, <5"
sphinxcontrib-mermaid = ">=1.0, <2"
[feature.docs.tasks]
orgbld = { cmd = "emacs --batch -l docs/export.el", description = "Export docs/orgmode/*.org to docs/source/*.rst" }
docs = { cmd = "sphinx-build docs/source docs/build -b html", depends-on = ["orgbld"], description = "Build the Sphinx HTML docs" }
docs-clean = { cmd = "rm -rf docs/build docs/source/*.rst", description = "Remove built docs and ox-rst output" }

[environments]
default = []
docs = ["docs"]

[tasks]
fixtures = "bash scripts/gen-sample-fixtures.sh"
fixtures-check = { cmd = "bash scripts/gen-sample-fixtures.sh --check", description = "Assert goldens still match the capnp CLI" }
test = "bun test packages/runtime"
build-peer = { cmd = "bash interop/build-peer.sh", description = "Build the capnp-C++ Adder peer for the RPC interop test" }
rpc-interop = { cmd = "bash interop/run_rpc_interop.sh build-interop/rpc_peer_server interop/rpc_client.ts", depends-on = ["build-peer"], description = "Run this vat against a live capnp-C++ peer" }
