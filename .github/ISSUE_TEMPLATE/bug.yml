name: Bug
description: Wrong output, a crash or a failed build
labels: [bug]
body:
- type: textarea
  id: what
  attributes:
    label: What happens
    description: Command, input and the output you got.
  validations: {required: true}
- type: textarea
  id: expected
  attributes:
    label: What you expected
    description: For wire or codec bugs, the capnp 1.4.0 output.
  validations: {required: true}
- type: input
  id: version
  attributes:
    label: Version and platform
