name: prek

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: prek-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install prek
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c9b9e9d03ab6044e6f # v2
        with:
          # prek >= 0.4 discovers prek.toml; 0.3 looked only for .pre-commit-config.yaml
          tool: prek@0.4.4

      - name: Run prek
        run: prek run -a --refresh
