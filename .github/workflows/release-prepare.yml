name: Release prepare (dry-run)
on:
  pull_request:
    paths:
    - cog.toml
    - towncrier.toml
    - scripts/release_notes.py
    - docs/newsfragments/**
    - CHANGELOG.md
    - .github/workflows/release*.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - run: python3 -m pip install --quiet towncrier
    - name: Fragments build cleanly
      run: towncrier build --draft
    - name: Config parses
      run: python3 -c "import tomllib, pathlib; [tomllib.loads(pathlib.Path(f).read_text()) for f in ('cog.toml','towncrier.toml')]"
