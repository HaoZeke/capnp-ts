# Bun workspace: unit tests, optional capnp fixture regen, capnpc-ts smoke.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Install before tests: live capnp compile paths use test.skipIf(!hasCapnp).
      # Critical codegen suites use offline CGR fixtures and must not soft-pass.
      - name: Install capnproto (tests + fixture regen + codegen smoke)
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto
          capnp --version

      # packages/runtime/test/pycapnp-interop.test.ts asserts this venv is
      # present rather than skipping, so bidirectional interop against the
      # official Python bindings actually runs.
      - name: pycapnp venv (bidirectional interop)
        run: |
          python3 -m venv .venv-pycapnp
          .venv-pycapnp/bin/pip install --quiet --upgrade pip
          .venv-pycapnp/bin/pip install --quiet pycapnp
          .venv-pycapnp/bin/python -c "import capnp; print('pycapnp ok')"

      - name: Test
        run: bun test

      - name: Typecheck packages
        run: bun run build

      # Regenerating and checking only for non-empty would accept a golden
      # that drifted; --check asserts the bytes still match the capnp CLI,
      # which is what makes them evidence of upstream parity.
      - name: Goldens still match the capnp CLI
        run: bash scripts/gen-sample-fixtures.sh --check

      - name: Codegen smoke
        run: |
          mkdir -p /tmp/capnpc-ts-smoke
          capnp compile -o- schema/addressbook.capnp \
            > /tmp/capnpc-ts-smoke/addressbook.cgr.bin
          test -s /tmp/capnpc-ts-smoke/addressbook.cgr.bin
          cd /tmp/capnpc-ts-smoke
          "$GITHUB_WORKSPACE/packages/codegen/bin/capnpc-ts" \
            --stdout addressbook.cgr.bin | head -c 400
          echo
          "$GITHUB_WORKSPACE/packages/codegen/bin/capnpc-ts" addressbook.cgr.bin
          test -s addressbook.ts

  rpc-interop:
    name: live capnp-C++ RPC peer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: default
          locked: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Byte equality against our own encoders says nothing about whether
      # the reference implementation will talk to us. This bootstraps a
      # real EzRpcServer and calls it.
      - name: Build the capnp-C++ peer
        run: pixi run -- bash interop/build-peer.sh
      - name: Call it from this vat
        run: pixi run -- bash interop/run_rpc_interop.sh build-interop/rpc_peer_server interop/rpc_client.ts
