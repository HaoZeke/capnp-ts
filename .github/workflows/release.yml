name: Release
on:
  push:
    tags:
    - 'v*'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - id: meta
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
    - name: Changelog has a section for this tag
      run: python3 scripts/release_notes.py "${{ steps.meta.outputs.version }}" -o "${RUNNER_TEMP}/notes.md"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: notes
        path: ${{ runner.temp }}/notes.md
  github-release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: notes
        path: notes
    - env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        PRE: ${{ needs.gate.outputs.prerelease }}
      run: |
        FLAG=()
        if [ "$PRE" = "true" ]; then FLAG=(--prerelease); fi
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes/notes.md "${FLAG[@]}"
        else
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes/notes.md "${FLAG[@]}"
        fi
